# All three resources explicitly request free plans. Review Render's cost preview.
services:
  - type: web
    name: week4-task6-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./week4-task6/Dockerfile
    dockerContext: ./week4-task6
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: week4-task6-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: week4-task6-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: REDIS_CACHE_ENABLED
        value: 'true'
      - key: EMAIL_QUEUE_ENABLED
        value: 'true'
      - key: LOG_LEVEL
        value: info
  - type: keyvalue
    name: week4-task6-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: week4-task6-db
    plan: free
    region: singapore
    databaseName: week4_task6
    user: app
    ipAllowList: []
